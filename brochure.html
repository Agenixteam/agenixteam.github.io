<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AGENIX · Group Brochures</title>
<meta name="theme-color" content="#171514">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* per-company theme is set from JS: --bg, --bg2, --accent */
:root{--bg:#171514;--bg2:#2b1f18;--accent:#f7941d;--text:#fff;--muted:rgba(255,255,255,.72);--glass:rgba(0,0,0,.28);--line:rgba(255,255,255,.14);--gut:16px}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{background:var(--bg);transition:background-color .5s}
body{min-height:100vh;color:var(--text);font:400 15px/1.5 Inter,system-ui,sans-serif;overflow-x:hidden;
  background:radial-gradient(120% 60% at 50% 0%,color-mix(in srgb,var(--accent) 28%,transparent) 0%,transparent 60%),
             linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%) fixed;
  transition:background .5s}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.wrap{max-width:960px;margin:0 auto;padding:0 var(--gut)}
.top{position:sticky;top:0;z-index:10;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:52px}
.back{display:flex;align-items:center;gap:6px;font:600 14px Rubik;min-height:44px}
.back svg{width:18px;height:18px}
/* keep the AGENIX CI colours as-is: sit the logo on a light chip so it reads on every company theme */
.bar img{height:30px;padding:6px 12px;background:#fff;border-radius:9px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:10px 0 14px;max-width:640px;margin:0 auto}
@media (max-width:480px){.tabs{gap:6px}.tab{font-size:10.5px}.tab img{border-radius:12px}}
.tab{display:flex;flex-direction:column;align-items:center;gap:6px;font:600 12px/1.2 Rubik;color:var(--muted);text-align:center}
.tab img{width:100%;max-width:80px;aspect-ratio:1;border-radius:18px;opacity:.6;transition:opacity .2s,box-shadow .2s,transform .2s}
.tab:hover img{opacity:.9}
.tab[aria-current]{color:var(--text)}
.tab[aria-current] img{opacity:1;transform:scale(1.06);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent),0 10px 24px -8px rgba(0,0,0,.6)}
.head{padding:24px 0 16px;text-align:center}
.head h1{font:700 clamp(26px,6vw,36px)/1.15 Rubik}
.head p{color:var(--muted);margin:6px auto 0;max-width:46ch}
.acts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}
.btn{display:inline-flex;align-items:center;gap:7px;min-height:46px;padding:0 18px;border-radius:12px;font:600 14px Rubik;border:1.5px solid var(--line);background:rgba(255,255,255,.08);color:var(--text);transition:background .15s}
.btn:hover{background:rgba(255,255,255,.16)}
.btn.pri{background:var(--accent);border-color:transparent;color:#111}
.btn svg{width:17px;height:17px}
.hint{text-align:center;font-size:12.5px;color:var(--muted);margin:2px 0 14px}
/* pages stack top-to-bottom, as large as the screen allows */
.pages{display:flex;flex-direction:column;gap:18px;max-width:900px;margin:0 auto;padding-bottom:32px}
.pages a{display:block;border-radius:14px;overflow:hidden;box-shadow:0 18px 40px -18px rgba(0,0,0,.7);background:rgba(255,255,255,.06)}
.pages img{width:100%;height:auto;aspect-ratio:auto 1400/1986}   /* reserves space; real ratio wins once loaded */
.pages.swap{animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* "Our works" showcase (only on companies that have works, e.g. EchoBlitz) — styled like the brochure: accent rule + spaced caps */
.works{max-width:900px;margin:14px auto 34px;padding-top:26px;border-top:1px solid var(--line)}
.eyebrow{display:flex;align-items:center;gap:12px;font:600 11.5px Rubik;letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}
.eyebrow::before{content:"";width:34px;height:3px;border-radius:3px;background:var(--accent)}
.works h2{font:700 clamp(22px,4.6vw,28px)/1.2 Rubik;margin:8px 0 4px}
.works .sub{color:var(--muted);font-size:14px;margin-bottom:14px}
/* game filter: wrapping grid (no sideways scroll) so every game is visible on a phone; name above, count below */
.wtabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:2px 0 14px}
.wtab{display:flex;align-items:center;gap:9px;min-height:50px;padding:6px 12px 6px 6px;border-radius:12px;font:600 15px/1.2 Rubik;color:var(--text);text-align:left;
  border:1.5px solid var(--line);background:rgba(255,255,255,.08);cursor:pointer;min-width:0;transition:background .15s,border-color .15s}
.wtab:not(:has(img)){padding-left:14px}
.wtab:hover{background:rgba(255,255,255,.16)}
.wtab img{flex:none;width:36px;height:36px;border-radius:9px;object-fit:cover}
.wtab span{display:flex;flex-direction:column;gap:2px;min-width:0}
.wtab small{font:500 12px/1.25 Inter;color:var(--muted)}
.wtab small i{font-style:normal;white-space:nowrap}
.wtab[aria-pressed=true]{background:var(--accent);border-color:transparent;color:#111}
.wtab[aria-pressed=true] small{color:rgba(0,0,0,.65)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));grid-auto-flow:dense;gap:12px}
.wcard{position:relative;aspect-ratio:16/10;border-radius:14px;overflow:hidden;cursor:zoom-in;border:1px solid var(--line);
  background:radial-gradient(110% 90% at 50% 35%,color-mix(in srgb,var(--accent) 14%,var(--bg2)) 0%,var(--bg) 75%);
  box-shadow:0 18px 40px -18px rgba(0,0,0,.7);transition:transform .2s,border-color .2s}
.wcard:hover{transform:translateY(-2px);border-color:var(--accent)}
.wcard.big{grid-column:span 2;grid-row:span 2;aspect-ratio:auto}
@media (max-width:600px){.wcard.big{grid-column:auto;grid-row:auto;aspect-ratio:16/10}}
.wcard video,.wcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wcard img{object-fit:contain;padding:12px}
.wcard .play{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#111;font-size:10px}
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;padding:20px}
.lb.open{display:flex}
.lb video,.lb img{max-width:100%;max-height:86vh;border-radius:12px}
.lb button{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:rgba(255,255,255,.1);color:#fff;font-size:18px;cursor:pointer}
footer{text-align:center;padding:4px 0 calc(32px + env(safe-area-inset-bottom))}
footer .btn{justify-content:center;width:100%;max-width:380px}
@media (max-width:480px){.pages{margin:0 calc(var(--gut) * -1 + 6px)}.pages a{border-radius:10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
</style>
</head>

const ICON = {
  web:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 7L2 7"/></svg>'
};
const tabs = document.getElementById('tabs');
const pages = document.getElementById('pages');
const meta = document.querySelector('meta[name=theme-color]');
CO.forEach(c => {
  const a = document.createElement('a');
  a.className = 'tab'; a.href = '?c=' + c.id; a.dataset.id = c.id;
  a.innerHTML = `<img src="${c.icon}" alt="">${c.short}`;
  a.onclick = e => { e.preventDefault(); show(c.id, true); };
  tabs.appendChild(a);
  c.pages.forEach(p => { new Image().src = p; });   // warm the cache so switching is instant
});

/* ---- our works ---- */
const works = document.getElementById('works'), wtabs = document.getElementById('wtabs'), wgrid = document.getElementById('wgrid');
const io = new IntersectionObserver(es => es.forEach(e => {   // videos only play while on screen
  const v = e.target; if (e.isIntersecting) { if (!v.src) v.src = v.dataset.src; v.play().catch(() => {}); } else v.pause();
}), {rootMargin: '200px'});
function count(fs) { const v = fs.filter(f => f.video).length, p = fs.length - v; return [v && v + (v > 1 ? ' videos' : ' video'), p && p + (p > 1 ? ' images' : ' image')].filter(Boolean).map(s => `<i>${s}</i>`).join(' · '); }
function showWorks(c) {
  works.hidden = !c.works.length;
  document.getElementById('hint').textContent = c.works.length ? 'Scroll down for the brochure and our works · tap to open full size' : 'Scroll down for all pages · tap a page to open it full size';
  if (!c.works.length) return;
  const all = c.works.flatMap(w => w.files.map(f => ({...f, game: w.game})));
  const opts = [{game: 'All', files: all}, ...c.works];
  wtabs.innerHTML = opts.map((w, i) => `<button class="wtab" data-i="${i}">${w.icon ? `<img src="${w.icon}" alt="">` : ''}<span>${w.game}<small>${count(w.files)}</small></span></button>`).join('');
  wtabs.querySelectorAll('.wtab').forEach(b => b.onclick = () => pick(+b.dataset.i));
  function pick(i) {
    wtabs.querySelectorAll('.wtab').forEach(b => b.setAttribute('aria-pressed', +b.dataset.i === i));
    const fs = [...opts[i].files].sort((a, b) => b.video - a.video);
    wgrid.innerHTML = '';
    fs.forEach((f, k) => {
      const d = document.createElement('div');
      d.className = 'wcard' + (f.video && k % 5 === 0 ? ' big' : '');
      d.innerHTML = f.video ? `<video muted loop playsinline preload="none" data-src="${f.src}"></video><span class="play">▶</span>` : `<img src="${f.src}" alt="${f.game} item" loading="lazy">`;
      if (f.video) io.observe(d.querySelector('video'));
      d.onclick = () => openLb(f);
      wgrid.appendChild(d);
    });
  }
  pick(0);
}
const lb = document.getElementById('lb'), lbBody = document.getElementById('lbBody');
function openLb(f) { lbBody.innerHTML = f.video ? `<video src="${f.src}" autoplay loop controls playsinline></video>` : `<img src="${f.src}" alt="">`; lb.classList.add('open'); }
function closeLb() { lb.classList.remove('open'); lbBody.innerHTML = ''; }
document.getElementById('lbX').onclick = closeLb;
lb.onclick = e => { if (e.target === lb) closeLb(); };
addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });
function show(id, push) {
  const c = CO.find(x => x.id === id) || CO[0];
  const root = document.documentElement.style;
  root.setProperty('--bg', c.bg); root.setProperty('--bg2', c.bg2); root.setProperty('--accent', c.accent);
  meta.content = c.bg;
  document.title = c.name + ' · AGENIX';
  tabs.querySelectorAll('.tab').forEach(t => t.toggleAttribute('aria-current', t.dataset.id === c.id));
  document.getElementById('name').textContent = c.name;
  document.getElementById('tagline').textContent = c.tagline;
  document.getElementById('acts').innerHTML =
    (c.web ? `<a class="btn pri" href="${c.web}" target="_blank" rel="noopener">${ICON.web}${c.webLabel}</a>` : '') +
    (c.email ? `<a class="btn" href="mailto:${c.email}">${ICON.mail}${c.email}</a>` : '');
  pages.innerHTML = c.pages.map((p, i) =>
    `<a href="${p}" target="_blank" rel="noopener"><img src="${p}" alt="${c.name} brochure page ${i + 1}"></a>`).join('');
  showWorks(c);
  pages.classList.remove('swap'); void pages.offsetWidth; pages.classList.add('swap');
  if (push) {
    history.replaceState(null, '', '?c=' + c.id); scrollTo({top: 0, behavior: 'smooth'});
    window.goatcounter && goatcounter.count && goatcounter.count({path: location.pathname + '?c=' + c.id});   // count each company switch as a view
  }
}
show(new URLSearchParams(location.search).get('c'));
