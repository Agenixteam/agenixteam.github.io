<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AGENIX · Group Brochures</title>
<meta name="theme-color" content="#4b1f78">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a1446;--ink-2:#5a4a72;--purple:#5b2591;--purple-deep:#3d1466;--violet:#8a3fc0;--line:#e7e0f1;--bg:#f8f6fc;
  --grad:linear-gradient(100deg,#8a2fb4 0%,#5d4fd6 45%,#2fa6e8 100%);--gut:16px}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 Inter,system-ui,sans-serif;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.wrap{max-width:720px;margin:0 auto;padding:0 var(--gut)}
.top{position:sticky;top:0;z-index:10;background:rgba(248,246,252,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:52px}
.back{display:flex;align-items:center;gap:6px;font:600 14px Rubik;color:var(--purple);min-height:44px}
.back svg{width:18px;height:18px}
.bar img{height:20px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px 0 12px}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;font:600 11.5px/1.2 Rubik;color:var(--ink-2);text-align:center}
.tab img{width:100%;max-width:64px;aspect-ratio:1;border-radius:14px;opacity:.7;transition:opacity .15s,box-shadow .15s,transform .15s}
.tab[aria-current] img{opacity:1;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--violet);transform:translateY(-1px)}
.tab[aria-current]{color:var(--purple-deep)}
.head{padding:20px 0 14px}
.head h1{font:700 26px/1.15 Rubik;color:var(--purple-deep)}
.head p{color:var(--ink-2);margin-top:4px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 16px;border-radius:12px;font:600 14px Rubik;border:1.5px solid #d9cdee;background:#fff;color:var(--purple)}
.btn.pri{background:var(--grad);color:#fff;border:0}
.btn svg{width:17px;height:17px}
.pages{display:grid;gap:14px;padding-bottom:28px}
.pages a{display:block;border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(60,20,100,.06),0 12px 28px -14px rgba(60,20,100,.35);background:#ddd}
.pages img{width:100%;height:auto;aspect-ratio:1400/1986}
.hint{text-align:center;font-size:12.5px;color:#8a7fa0;margin:-4px 0 14px}
footer{text-align:center;padding:8px 0 calc(28px + env(safe-area-inset-bottom))}
footer .btn{justify-content:center;width:100%;max-width:360px}
@media (min-width:720px){.pages{grid-template-columns:1fr 1fr}}
</style>
</head>

const tabs = document.getElementById('tabs');
CO.forEach(c => {
  const a = document.createElement('a');
  a.className = 'tab'; a.href = '?c=' + c.id; a.dataset.id = c.id;
  a.innerHTML = `<img src="${c.icon}" alt="">${c.short}`;
  a.onclick = e => { e.preventDefault(); show(c.id, true); };
  tabs.appendChild(a);
});
function show(id, push) {
  const c = CO.find(x => x.id === id) || CO[0];
  document.title = c.name + ' · AGENIX';
  tabs.querySelectorAll('.tab').forEach(t => t.toggleAttribute('aria-current', t.dataset.id === c.id));
  document.getElementById('name').textContent = c.name;
  document.getElementById('tagline').textContent = c.tagline;
  document.getElementById('acts').innerHTML =
    (c.web ? `<a class="btn pri" href="${c.web}" target="_blank" rel="noopener">${ICON.web}${c.webLabel}</a>` : '') +
    (c.email ? `<a class="btn" href="mailto:${c.email}">${ICON.mail}${c.email}</a>` : '');

    `<a href="${p}" target="_blank" rel="noopener"><img src="${p}" alt="${c.name} brochure page ${i + 1}" ${i ? 'loading="lazy"' : ''}></a>`).join('');
  if (push) { history.replaceState(null, '', '?c=' + c.id); scrollTo({top: 0, behavior: 'smooth'}); }
}
show(new URLSearchParams(location.search).get('c'));
